<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>MIRS Análisis de Desviaciones</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style id="css">
/* Estilo MIRS — mismas variables y componentes del Sistema de Control de Gestión MIRS.
   Diseño de un solo tema (claro) a propósito: es el formato corporativo MIRS. */
:root{
  --tinta:#1F3B36; --texto:#2B2B2B; --gris:#6B6B6B; --ui-linea:#D9DBD8; --fondo:#EDEFEE; --blanco:#fff;
  --Negro:#000; --Rojo:#fe0505; --FondoBarra:#ec8d07; --amarillo:#FFC000; --amar:#FFF6DF;
  --ui-verde:#2F8F5B; --verdeBg:#DDF1E6; --verdeTx:#1E6B43; --ambar:#8A5A00; --ambarBg:#FFF0C2;
  --rojoBg:#F8DCDC; --rojoTx:#9B3B3B; --azulBg:#E3EDFB; --azulTx:#1F4E8C;
  --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--texto);font:14px/1.45 "Segoe UI",Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--FondoBarra)}
body.noscroll{overflow:hidden}
::selection{background:var(--FondoBarra);color:#1A1A1A}
button,input,select,textarea{font:inherit}
@keyframes ent{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Barra superior */
.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--FondoBarra);box-shadow:0 2px 8px rgba(0,0,0,.12);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.barra h1{font-size:15px;margin:0 auto 0 0;font-weight:700;color:var(--Negro);line-height:1.25}
.barra h1 small{display:block;font-weight:400;font-size:11.5px}
.menu-link{display:inline-flex;align-items:center;background:rgba(255,255,255,.88);border:1px solid rgba(0,0,0,.12);border-radius:30px;padding:5px 14px;flex:0 0 auto}
.menu-link img{height:24px;width:auto;display:block}
.acciones-barra{display:flex;flex-wrap:wrap;gap:8px}

/* Botones */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--ui-linea);background:var(--blanco);color:var(--tinta);padding:8px 14px;border-radius:8px;font:600 13px "Segoe UI",Arial,sans-serif;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--Negro);color:var(--Negro);transform:translateY(-1px)}
.btn:active{transform:none}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
.btn:focus-visible,.tab:focus-visible,.step:focus-visible,.dlink:focus-visible{outline:3px solid rgba(0,0,0,.35);outline-offset:2px}
.btn.pri{background:var(--Negro);border-color:var(--Negro);color:#fff}
.btn.pri:hover{background:var(--Rojo);border-color:var(--Rojo);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.del:hover{border-color:var(--Rojo);color:var(--Rojo);background:var(--blanco)}
.btn.peligro{background:var(--Rojo);border-color:var(--Rojo);color:#fff}
.btn.peligro:hover{background:#c40000;border-color:#c40000;color:#fff}
.barra .btn{background:rgba(255,255,255,.9);border-color:rgba(0,0,0,.12)}
.barra .btn:hover{background:#fff}
.barra .btn.pri{background:var(--Negro);border-color:var(--Negro);color:#fff}
.barra .btn.pri:hover{background:var(--Rojo);border-color:var(--Rojo)}

/* Contenedor, pestañas y tarjetas */
.wrap{max-width:1180px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs{display:inline-flex;flex-wrap:wrap;background:var(--blanco);border:1px solid var(--ui-linea);border-radius:12px;padding:4px;gap:4px;margin-bottom:18px;box-shadow:var(--sombra)}
.tab{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:9px 18px;border-radius:9px;font:600 13px "Segoe UI",Arial,sans-serif;color:var(--gris);cursor:pointer;transition:.15s}
.tab:hover{color:var(--Negro);background:#F4F5F3}
.tab.on{background:var(--Negro);color:#fff}
.tab .cnt{background:var(--amarillo);color:#000;border-radius:99px;padding:0 7px;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums}
.vista{animation:ent .25s ease}
.tarjeta{background:var(--blanco);border:1px solid var(--ui-linea);border-radius:12px;padding:20px 22px;margin-bottom:16px;box-shadow:var(--sombra)}
.sec-h{display:flex;align-items:center;gap:12px;margin-bottom:16px;min-width:0}
.sec-h .n{min-width:28px;height:28px;padding:0 6px;border-radius:99px;background:var(--amarillo);color:#000;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-variant-numeric:tabular-nums}
.sec-h h2{margin:0;font-size:15px;font-weight:700;color:var(--Negro);min-width:0;overflow-wrap:anywhere;text-wrap:balance}
.sec-h small{display:block;font-weight:400;font-size:11.5px;color:var(--gris);margin-top:1px}
.sub{border:1px solid var(--ui-linea);border-radius:10px;padding:14px;margin:12px 0;background:var(--blanco)}
h3{margin:0 0 6px;font-size:14px;font-weight:700;color:var(--Negro)}
h4{margin:0 0 2px;font-size:13.5px;font-weight:700;color:var(--Negro);display:flex;align-items:center;gap:8px}
h4::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--amarillo);flex:0 0 auto}
.muted{color:var(--gris)} .small{font-size:12px}
.nota{font-size:11.5px;color:var(--gris);line-height:1.5;margin-top:12px}

/* Lista de desviaciones */
.lhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.lhead .sec-h{margin:0 auto 0 0}
.lhead input[type=search]{width:240px;max-width:100%}
.dlist{display:flex;flex-direction:column;gap:10px}
.ditem{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:4px 14px;align-items:center;background:var(--blanco);border:1px solid var(--ui-linea);border-radius:12px;padding:14px 16px;box-shadow:var(--sombra);transition:border-color .15s}
.ditem:hover{border-color:#BDBFBB}
.dnum{width:36px;height:36px;border-radius:50%;background:var(--amarillo);color:#000;font-weight:800;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;align-self:start}
.dbody{min-width:0;display:flex;flex-direction:column;gap:6px}
.dlink{all:unset;cursor:pointer;font-size:14.5px;font-weight:700;color:var(--Negro);overflow-wrap:anywhere;border-radius:4px}
.dlink:hover{text-decoration:underline;text-decoration-color:var(--FondoBarra);text-underline-offset:3px}
.dlink.vacio{color:var(--gris);font-style:italic;font-weight:600}
.dmeta{font-size:12px;color:var(--gris)}
.prog{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:340px}
.prog i{height:6px;border-radius:3px;background:#E3E5E2}
.prog i.ok{background:var(--FondoBarra)}
.dchips{font-size:12px;color:var(--texto);font-variant-numeric:tabular-nums}
.dside{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-block;border-radius:99px;padding:4px 11px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.b{background:#EEEEEE;color:#444}
.pill.a{background:var(--ambarBg);color:var(--ambar)}
.pill.p{background:var(--azulBg);color:var(--azulTx)}
.pill.c{background:var(--verdeBg);color:var(--verdeTx)}
.vacio-box{text-align:center;padding:34px 20px}
.vacio-box h3{font-size:16px}
.vacio-box p{max-width:520px;margin:6px auto 16px;color:var(--gris)}
.vacio-box .fila{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.devtop{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.devtop .grow{flex:1}
.devtop select{width:auto;max-width:100%;padding:6px 10px;background:var(--blanco)}

/* Pasos */
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.step{border:1px solid var(--ui-linea);background:var(--blanco);color:var(--tinta);border-radius:99px;padding:7px 16px;cursor:pointer;font:600 13px "Segoe UI",Arial,sans-serif;transition:.15s}
.step:hover{border-color:var(--Negro)}
.step.on{background:var(--Negro);border-color:var(--Negro);color:#fff}
.step small{opacity:.75;margin-left:4px;font-weight:600}
.nav{display:flex;justify-content:space-between;margin-top:18px;gap:10px;flex-wrap:wrap}

/* Campos: amarillo suave donde se escribe; foco naranja */
.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:14px 16px}
.rejilla .full{grid-column:1/-1}
.campo{display:flex;flex-direction:column;gap:5px;min-width:0}
.campo>span{font-size:11px;color:var(--gris);font-weight:700;letter-spacing:.3px;text-transform:uppercase}
input[type=text],input[type=date],input[type=search],select,textarea,.campo input{border:1px solid var(--ui-linea);border-radius:8px;padding:9px 11px;background:var(--amar);font:13px "Segoe UI",Arial,sans-serif;color:var(--texto);transition:border-color .15s,box-shadow .15s;width:100%;min-width:0}
input[type=search]{background:var(--blanco)}
input:hover,select:hover,textarea:hover{border-color:#BDBFBB}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--FondoBarra)!important;box-shadow:0 0 0 3px rgba(236,141,7,.22);background:#fff}
textarea{resize:vertical;line-height:1.45}
.row{display:flex;gap:6px;margin:6px 0}
.x{border:1px solid var(--ui-linea);background:var(--blanco);border-radius:8px;width:36px;cursor:pointer;color:var(--gris);flex:0 0 auto}
.x:hover{color:var(--Rojo);border-color:var(--Rojo)}

/* Evidencia adjunta */
.evid{display:flex;flex-direction:column;gap:8px;min-width:0}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:2px dashed #E3C77A;background:var(--amar);border-radius:10px;padding:16px;cursor:pointer;text-align:center;transition:.15s}
.drop:hover,.drop.over{border-color:var(--FondoBarra);background:#FFF0D0}
.drop:focus-within{outline:3px solid rgba(236,141,7,.35);outline-offset:2px}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.drop b{color:var(--tinta);font-size:13.5px}
.drop small{color:var(--gris);font-size:11.5px}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.ecard{border:1px solid var(--ui-linea);border-radius:10px;overflow:hidden;background:var(--blanco);display:flex;flex-direction:column;min-width:0}
.eth{height:110px;background:#F4F5F3;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--gris);font-size:11px;text-align:center;padding:0 6px}
.eth img{width:100%;height:100%;object-fit:cover;display:block}
.eth.ico{font-weight:800;font-size:18px;color:var(--tinta);letter-spacing:.5px;background:var(--amar)}
.einfo{padding:8px 10px 0;display:flex;flex-direction:column;min-width:0}
.ename{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.einfo small{color:var(--gris);font-size:11px;font-variant-numeric:tabular-nums}
.ebtn{display:flex;gap:6px;padding:8px 10px;justify-content:space-between;align-items:center}
.ebtn .x{height:30px}
.pevid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pevid figure{margin:0;border:1px solid var(--ui-linea);border-radius:8px;padding:6px;text-align:center;break-inside:avoid;page-break-inside:avoid}
.pevid img{max-width:100%;max-height:62mm;object-fit:contain}
.pevid figcaption{font-size:10px;color:var(--gris);margin-top:4px;overflow-wrap:anywhere}

/* Ishikawa por categorías */
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cats .sub{margin:0}

/* 5 porqués */
.tag{display:inline-block;background:var(--amarillo);color:#000;border-radius:99px;padding:2px 10px;font-size:11px;font-weight:800;margin-right:8px;text-transform:uppercase;letter-spacing:.3px}
.tag.raiz{background:var(--FondoBarra)}
.whyhead{margin-bottom:10px;overflow-wrap:anywhere}
.why .campo.inline{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:8px;margin:6px 0}
.campo.root>span{color:var(--ambar)}
.campo.root textarea{background:#FFF3E4;border-color:var(--FondoBarra)}

/* Plan de acción */
.acc{display:grid;grid-template-columns:2fr 1.2fr 1fr 1.4fr 1fr 36px;gap:8px;align-items:end;margin:10px 0}

/* Avisos */
.banner{display:flex;gap:12px;align-items:center;background:#FFF8E6;border:1px solid #F0D48A;border-left:5px solid var(--FondoBarra);border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:13px;font-weight:600}
.banner.falta{background:#FBEDED;border-color:#E4B4B4;border-left-color:var(--Rojo);color:#8A2E2E}

/* Resumen */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:16px}
.stat{background:var(--blanco);border:1px solid var(--ui-linea);border-left:5px solid var(--amarillo);border-radius:12px;padding:14px 16px;box-shadow:var(--sombra);font-size:11.5px;color:var(--gris);font-weight:600}
.stat b{display:block;font-size:26px;line-height:1.1;color:var(--Negro);font-variant-numeric:tabular-nums}
.stat.v{border-left-color:var(--ui-verde)} .stat.p{border-left-color:var(--tinta)} .stat.o{border-left-color:var(--FondoBarra)}
.desliza{overflow-x:auto;border-radius:8px}
table.lista{width:100%;border-collapse:separate;border-spacing:0;border:1px solid #C9CBC7;border-radius:8px;overflow:hidden}
table.lista th{background:var(--amarillo);color:#000;border:0;font-size:10.5px;font-weight:800;padding:8px 10px;text-align:left;text-transform:uppercase;letter-spacing:.5px}
table.lista td{border:0;border-top:1px solid #E3E5E2;padding:8px 10px;font-size:12.5px;vertical-align:top;background:#fff}
table.lista tbody tr:nth-child(even) td{background:#FAFAF8}
table.lista td.k{background:#FFFBF0;font-weight:700;width:18%}
span.est,select.est{display:inline-block;width:auto;border:0;border-radius:99px;padding:4px 11px;font-size:11.5px;font-weight:700;white-space:nowrap}
select.est{cursor:pointer;padding-right:8px}
.est-Pendiente{background:#EEEEEE!important;color:#444}
.est-En-curso{background:var(--ambarBg)!important;color:var(--ambar)}
.est-Cerrada{background:var(--verdeBg)!important;color:var(--verdeTx)}

/* Ishikawa (SVG) */
#fishwrap{overflow-x:auto}
.fish{width:100%;min-width:640px;height:auto;display:block}
.fish .fl{stroke:var(--tinta);stroke-width:1.5;fill:none}
.fish .rib{stroke:var(--gris);stroke-width:1;fill:none}
.fish .bx{fill:var(--amarillo);stroke:var(--tinta);stroke-width:1.2}
.fish .eb{fill:var(--FondoBarra);stroke:var(--Negro);stroke-width:1.5}
.fish .fa{fill:var(--tinta)}
.fish text{fill:#000;font-family:"Segoe UI",Arial,sans-serif}
.fish .cn{font-size:13px;font-weight:700}
.fish .ct{font-size:11.5px;fill:var(--texto)}
.fish .en{font-size:12.5px;font-weight:700}
.fish .ph{font-weight:400;font-style:italic;fill:#222}

.chk{list-style:none;padding:0;margin:0 0 12px;color:var(--ambar);font-weight:600}.chk li{padding:2px 0}
.saved{font-size:11.5px;color:var(--gris);max-width:1180px;margin:-40px auto 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:right}

/* Ventana de confirmación y avisos */
.modal{position:fixed;inset:0;z-index:80;background:rgba(20,26,24,.5);display:flex;align-items:center;justify-content:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.mbox{background:var(--blanco);border-radius:12px;border-top:5px solid var(--FondoBarra);max-width:480px;width:100%;padding:20px 22px;box-shadow:0 10px 40px rgba(0,0,0,.25);animation:ent .18s ease;max-height:85vh;overflow:auto}
.mbox h3{font-size:16px;margin-bottom:8px}
.mmsg{color:var(--texto);font-size:13.5px}
.mmsg ul{margin:8px 0;padding-left:18px;color:var(--ambar);font-weight:600}
.mbtns{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:90;background:#1A1A1A;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px);animation:ent .2s ease}

/* Vista completa (informe en pantalla) */
#vista{position:fixed;inset:0;z-index:60;background:var(--fondo);overflow:auto}
.vbar{position:sticky;top:0;z-index:2;background:var(--FondoBarra);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:0 2px 8px rgba(0,0,0,.12)}
.vbar b{margin-right:auto;color:#000}
.vbar .btn{background:rgba(255,255,255,.9);border-color:rgba(0,0,0,.12)}
.vbar .btn.pri{background:var(--Negro);color:#fff}
#print{max-width:1180px;margin:16px auto 40px;background:#fff;color:#222;padding:22px;border-radius:12px;box-shadow:var(--sombra);overflow-x:auto}
#vista #print{width:calc(100% - 32px)}
table.pw{width:100%;border-collapse:collapse;border:0}
table.pw>thead{display:table-header-group}
table.pw>thead>tr>td,table.pw>tbody>tr>td{border:0;padding:0;background:#fff}
.phead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;border-bottom:4px solid var(--FondoBarra);padding-bottom:6px;margin-bottom:10px}
.phead img{height:30px;justify-self:start}
.phead .pt{text-align:center}
.phead h1{margin:0;font-size:18px;line-height:1.15;color:#000}
.phead small{display:block;font-size:10.5px;color:var(--gris)}
.phead .pr{justify-self:end;text-align:right;font-size:10px;color:var(--gris);font-weight:600}
#print .pg{margin-top:26px}
#print .pg.first{margin-top:0}
#print h2{font-size:15px;margin:0 0 8px;text-align:center;color:#000;border-bottom:2px solid var(--amarillo);padding-bottom:4px}
#print h3{font-size:12.5px;margin:12px 0 4px;color:#000}
#print table.lista{margin-bottom:6px}
.fishp{text-align:center;overflow-x:auto}
.solo-nota{max-width:1180px;margin:16px auto 0;padding:10px 16px;background:#FFF8E6;border:1px solid #F0D48A;border-radius:10px;font-weight:600;font-size:13px}
body.solo::before{display:none}

@media (max-width:820px){
  .cats{grid-template-columns:1fr}.acc{grid-template-columns:1fr 1fr}.acc .x{width:100%;height:38px}
  .tarjeta{padding:16px 14px}.tab{padding:9px 12px}
  .why .campo.inline{grid-template-columns:1fr;gap:3px}
  #print{padding:14px}
  .pevid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:620px){
  .ditem{grid-template-columns:36px minmax(0,1fr)}
  .dside{grid-column:1/-1;justify-content:flex-start;margin-top:6px}
  .barra h1{flex:1 1 100%;order:-1;margin:0}
  .menu-link{order:-2}
  .lhead input[type=search]{width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Impresión / PDF (desde el informe descargado) */
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 landscape;margin:11mm 12mm 14mm}
  @page{@bottom-center{content:"MIRS · Análisis de Desviaciones · Página " counter(page) " de " counter(pages);font:9px "Segoe UI",Arial,sans-serif;color:#666}}
  html,body{background:#fff}
  body{font-size:11px;color:#222}
  body::before{display:none}
  .barra,#app,.saved,.vbar,.modal,.toast,.solo-nota{display:none!important}
  #vista{display:block!important;position:static;overflow:visible;background:#fff}
  #print{display:block;max-width:none;width:auto!important;margin:0;padding:0;border-radius:0;box-shadow:none;overflow:visible}
  #print .pg{margin-top:0;break-before:page;page-break-before:always}
  #print .pg.first{break-before:auto;page-break-before:auto}
  #print h2,#print h3{break-after:avoid;page-break-after:avoid}

}
const fillX = c => c ? `<a:solidFill><a:srgbClr val="${c}"/></a:solidFill>` : '<a:noFill/>';
const lineX = (c, w = 0.75) => c ? `<a:ln w="${Math.round(w * 12700)}"><a:solidFill><a:srgbClr val="${c}"/></a:solidFill></a:ln>` : '<a:ln><a:noFill/></a:ln>';

function shape(id, name, x, y, w, h, paras, o = {}) {

  return `<p:sp><p:nvSpPr><p:cNvPr id="${id}" name="${X(name)}"/><p:cNvSpPr><a:spLocks noGrp="1"/></p:cNvSpPr><p:nvPr>${tag}</p:nvPr></p:nvSpPr><p:spPr/><p:txBody><a:bodyPr/><a:lstStyle/><a:p><a:r><a:rPr lang="es-CL" dirty="0"/><a:t>${X(text)}</a:t></a:r></a:p></p:txBody></p:sp>`;
}
function line(id, x1, y1, x2, y2, color, wPt, arrow) {
  const fh = x2 < x1, fv = y2 < y1;
  return `<p:cxnSp><p:nvCxnSpPr><p:cNvPr id="${id}" name="Línea ${id}"/><p:cNvCxnSpPr/><p:nvPr/></p:nvCxnSpPr><p:spPr><a:xfrm${fh ? ' flipH="1"' : ''}${fv ? ' flipV="1"' : ''}><a:off x="${IN(Math.min(x1, x2))}" y="${IN(Math.min(y1, y2))}"/><a:ext cx="${IN(Math.abs(x2 - x1))}" cy="${IN(Math.abs(y2 - y1))}"/></a:xfrm><a:prstGeom prst="line"><a:avLst/></a:prstGeom><a:ln w="${Math.round(wPt * 12700)}"><a:solidFill><a:srgbClr val="${color}"/></a:solidFill>${arrow ? '<a:tailEnd type="triangle" w="med" len="med"/>' : ''}</a:ln></p:spPr></p:cxnSp>`;
}
/* Tabla nativa. rows = [{h, cells:[{t:string|string[], sz, b, c, fill, al, anchor}]}] */
function table(id, name, x, y, colW, rows) {
  const tw = colW.reduce((a, b) => a + b, 0);
  const th = rows.reduce((a, r) => a + r.h, 0);
  const tc = c => {
    const items = Array.isArray(c.t) ? c.t : [c.t == null ? '' : c.t];
    const ps = items.map((t, i) => para(t, {sz: c.sz || 10, b: c.b, c: c.c, al: c.al, i: c.i, sb: i ? 2 : 0})).join('');
    return `<a:tc><a:txBody><a:bodyPr/><a:lstStyle/>${ps}</a:txBody><a:tcPr marL="${IN(0.07)}" marR="${IN(0.07)}" marT="${IN(0.04)}" marB="${IN(0.04)}" anchor="${c.anchor || 'ctr'}"><a:lnL w="0"><a:noFill/></a:lnL><a:lnR w="0"><a:noFill/></a:lnR><a:lnT w="0"><a:noFill/></a:lnT><a:lnB w="6350"><a:solidFill><a:srgbClr val="${LINE}"/></a:solidFill></a:lnB>${c.fill ? fillX(c.fill) : '<a:noFill/>'}</a:tcPr></a:tc>`;
  };
  return `<p:graphicFrame><p:nvGraphicFramePr><p:cNvPr id="${id}" name="${X(name)}"/><p:cNvGraphicFramePr><a:graphicFrameLocks noGrp="1"/></p:cNvGraphicFramePr><p:nvPr/></p:nvGraphicFramePr><p:xfrm><a:off x="${IN(x)}" y="${IN(y)}"/><a:ext cx="${IN(tw)}" cy="${IN(th)}"/></p:xfrm><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/table"><a:tbl><a:tblPr firstRow="1" bandRow="1"/><a:tblGrid>${colW.map(w => `<a:gridCol w="${IN(w)}"/>`).join('')}</a:tblGrid>${rows.map(r => `<a:tr h="${IN(r.h)}">${r.cells.map(tc).join('')}</a:tr>`).join('')}</a:tbl></a:graphicData></a:graphic></p:graphicFrame>`;
}
const slideXml = shapes => `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<p:sld ${NS}><p:cSld><p:spTree><p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr><p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/><a:chOff x="0" y="0"/><a:chExt cx="0" cy="0"/></a:xfrm></p:grpSpPr>${shapes}</p:spTree></p:cSld><p:clrMapOvr><a:masterClrMapping/></p:clrMapOvr></p:sld>`;

/* ---------- utilidades de maquetación ---------- */
const chunkRows = (rows, heights, limit) => {
  const greedy = lim => {
    const pages = []; let cur = [], acc = 0;
    rows.forEach((r, i) => {
      if (cur.length && acc + heights[i] > lim) { pages.push(cur); cur = []; acc = 0; }
      cur.push(r); acc += heights[i];
    });
    if (cur.length) pages.push(cur);
    return pages.length ? pages : [[]];
  };
  let pages = greedy(limit);
  const k = pages.length;
  if (k > 1) {   // reparte parejo: evita que la última lámina quede con una sola fila
    const total = heights.reduce((x, y) => x + y, 0);
    const p2 = greedy(Math.min(limit, total / k + Math.max(...heights) * 0.6));
    if (p2.length === k) pages = p2;
  }
  return pages;
};
// estimación de la altura de una fila (pulgadas) según el texto y el ancho de cada columna
const estRow = (cells, colW, sz) => {
  let max = 1;
  cells.forEach((c, i) => {
    const items = Array.isArray(c) ? c : [c];
    const cpl = Math.max(4, Math.floor((colW[i] - 0.16) * 72 / (sz * 0.52)));
    let lines = 0; items.forEach(t => { lines += Math.max(1, Math.ceil(String(t || '').length / cpl)); });
    max = Math.max(max, lines);
  });
  return max * sz * 1.22 / 72 + 0.12;
};
const trunc = (s, n) => { s = String(s || '').trim(); return s.length > n ? s.slice(0, n - 1).trimEnd() + '…' : s; };

/* ---------- Ishikawa con formas nativas ---------- */
function ishikawa(d, idc) {
  const cats = d.fish;
  const n = Math.max(3, ...cats.map(c => c.items.length));
  const sp = n <= 3 ? 40 : 34, top = 8, bh = 30, L = n * sp + 30, sy = top + bh + L, H = sy + L + bh + top;
  const W = 900, RIB = 190, cols = [205, 420, 635], HX = 780;
  const s = Math.min(9 / W, 3.85 / H);
  const ox = 0.5 + (9 - W * s) / 2, oy = 1.1 + (3.85 - H * s) / 2;
  const ux = u => ox + u * s, uy = u => oy + u * s, k = s / 0.01;
  const fz = (v) => Math.max(7, Math.round(v * k * 2) / 2);
  let lines = '', boxes = '';
  lines += line(idc(), ux(20), uy(sy), ux(HX), uy(sy), DARK, 1.75, true);
  cats.forEach((c, ci) => {
    const up = ci < 3, cx = cols[ci % 3];
    const boxY = up ? top : sy + L, outer = up ? top + bh : sy + L;
    lines += line(idc(), ux(cx), uy(outer), ux(cx + 60), uy(sy), DARK, 1.25);
    boxes += shape(idc(), 'Categoría ' + c.name, ux(cx - 75), uy(boxY), 150 * s, bh * s,
      para(c.name, {sz: fz(10), b: 1, al: 'ctr', c: '1A1A1A'}), {fill: ORANGE, geom: 'roundRect', box: false, anchor: 'ctr', ins: 0.02});
    c.items.forEach((t, i) => {
      const y = up ? top + bh + (sp - 6) + i * sp : sy + L - (sp - 6) - i * sp;
      const xb = up ? cx + 60 * (y - (top + bh)) / L : cx + 60 * (sy + L - y) / L;
      lines += line(idc(), ux(xb - RIB), uy(y), ux(xb), uy(y), '8C8C8C', 0.75);
      boxes += shape(idc(), 'Causa ' + (i + 1), ux(xb - RIB + 2), uy(y - 1 - (sp - 6)), (RIB - 6 - (up ? Math.round(60 * (sp - 6) / L) + 6 : 0)) * s, (sp - 6) * s,
        para(trunc(t, 60), {sz: fz(9), c: DARK}), {anchor: 'b', ins: 0});
    });
  });
  boxes += shape(idc(), 'Desviación', ux(HX), uy(sy - 52), (W - HX) * s, 104 * s,
    para(trunc(d.titulo, 80), {sz: fz(10), b: 1, al: 'ctr', c: 'FFFFFF'}), {fill: DARK, geom: 'roundRect', box: false, anchor: 'ctr', ins: 0.04});
  return lines + boxes;
}

/* ---------- construcción de las diapositivas ---------- */
const ROOT = 'B03D00', GREY_BAR = 'BDBDBD';
// tarjeta gris con sombra (estilo del resumen MIRS)
const card = (idc, x, y, w, h, paras, o = {}) => shape(idc(), o.name || 'Tarjeta', x, y, w, h, paras,
  {fill: 'F2F2F2', geom: 'roundRect', adj: 7000, box: false, shadow: true, anchor: o.anchor || 't', ins: o.ins == null ? 0.18 : o.ins});
const dot = (idc, x, y, d, color) => shape(idc(), 'Punto', x, y, d, d, null, {fill: color, geom: 'ellipse', box: false});
// elige el mayor tamaño de letra que cabe en la caja; si no cabe, recorta el texto
function fitText(text, w, h, sizes) {
  text = String(text || '—');
  for (const sz of sizes) {
    const cpl = Math.max(4, Math.floor(w * 72 / (sz * 0.52)));
    const lines = Math.ceil(text.length / cpl) + (text.split('\n').length - 1);
    if (lines * sz * 1.25 / 72 <= h) return {t: text, sz};
  }
  const sz = sizes[sizes.length - 1];
  const cpl = Math.max(4, Math.floor(w * 72 / (sz * 0.52))), maxLines = Math.max(1, Math.floor(h * 72 / (sz * 1.25)));
  return {t: trunc(text, cpl * maxLines), sz};
}

function buildSlides(D) {
  const out = [];
  const mk = (fn) => { let n = 1; const idc = () => ++n; out.push(slideXml(fn(idc))); };
  const head = (idc, title, tag) =>
    ph(idc(), 'Título', 'title', title) + (tag ? ph(idc(), 'Etiqueta', 'tag', tag) : '');
  const devTag = d => 'Desviación ' + d.n + (d.ambito ? ' · ' + d.ambito : '');
  const sub = (idc, d) => shape(idc(), 'Desviación', 0.5, 0.74, 9, 0.3, para(d.titulo || ('Desviación ' + d.n), {sz: 13, b: 1, c: DARK}), {ins: 0});
  const hdr = (labels, sz) => ({h: 0.34, cells: labels.map(l => ({t: l, sz, b: 1, c: 'FFFFFF', fill: '1A1A1A'}))});
  const zebra = i => (i % 2 === 1 ? 'F2F2F2' : null);

  const devs = D.devs;
  let nC = 0, nR = 0, nA = 0; const est = {'Cerrada': 0, 'En curso': 0, 'Pendiente': 0};
  devs.forEach(d => d.causes.forEach(c => { nC++; if (c.root) nR++; c.acc.forEach(a => { nA++; est[a.e] = (est[a.e] || 0) + 1; }); }));

  // 1) Resumen con tarjetas y barra de estado
  mk(idc => {
    let s = head(idc, 'Resumen del análisis', 'Resumen');
    const stats = [[nC, 'Causas inmediatas identificadas con Ishikawa', DARK], [nR, 'Causas raíz encontradas con 5 porqués', DARK], [nA, 'Acciones en el plan (' + (est['Cerrada'] || 0) + ' cerradas)', 'F07F00']];
    stats.forEach((st, i) => {
      s += card(idc, 0.5 + i * 3.1, 1.2, 2.8, 1.7,
        para(String(st[0]), {sz: 40, b: 1, c: st[2]}) + para(st[1], {sz: 13, c: GRAY, sb: 4}), {name: 'Indicador ' + (i + 1), anchor: 'ctr'});
    });
    s += shape(idc(), 'Título barra', 0.5, 3.2, 9, 0.35, para('Estado de las acciones del plan', {sz: 15, b: 1, c: '1A1A1A'}), {ins: 0});
    const parts = [['Cerrada', '1A1A1A', '1A1A1A'], ['En curso', 'F07F00', 'F07F00'], ['Pendiente', GREY_BAR, '7F7F7F']];
    if (nA > 0) {
      let x = 0.5;
      parts.forEach(p => {
        const w = 9 * (est[p[0]] || 0) / nA;
        if (w > 0) { s += shape(idc(), 'Barra ' + p[0], x, 3.65, w, 0.4, null, {fill: p[1], box: false, shadow: true}); x += w; }
      });
      parts.forEach((p, i) => {
        const n = est[p[0]] || 0;
        s += shape(idc(), 'Leyenda ' + p[0], 0.5 + i * 3.1, 4.2, 2.9, 0.4,
          `<a:p><a:pPr algn="l"/>${run(p[0] + '  ', {sz: 14, b: 1, c: p[2]})}${run(n + ' · ' + Math.round(100 * n / nA) + '%', {sz: 14, c: '1A1A1A'})}</a:p>`, {ins: 0});
      });
    } else {
      s += shape(idc(), 'Sin acciones', 0.5, 3.7, 9, 0.4, para('Aún no hay acciones definidas en el plan.', {sz: 14, c: GRAY}), {ins: 0});
    }
    return s;
  });

  // 2) Tabla de desviaciones con fila de total
  mk(idc => {
    const cw = [0.7, 4.0, 1.3, 1.0, 1.0, 1.0];
    const rows = [hdr(['N°', 'Desviación', 'Ámbito', 'Causas', 'Raíces', 'Acciones'], 12)];
    devs.forEach((d, i) => rows.push({h: 0.5, cells: [
      {t: String(d.n), sz: 14, b: 1, fill: zebra(i)}, {t: d.titulo || '—', sz: 13, fill: zebra(i)}, {t: d.ambito || '—', sz: 13, fill: zebra(i)},
      {t: String(d.causes.length), sz: 14, fill: zebra(i)}, {t: String(d.causes.filter(c => c.root).length), sz: 14, fill: zebra(i)},
      {t: String(d.causes.reduce((a, c) => a + c.acc.length, 0)), sz: 14, fill: zebra(i)}]}));
    rows.push({h: 0.45, cells: [{t: '', fill: '1A1A1A'}, {t: 'Total', sz: 13, b: 1, c: 'FFFFFF', fill: '1A1A1A'}, {t: '', fill: '1A1A1A'},
      {t: String(nC), sz: 14, b: 1, c: 'FFFFFF', fill: '1A1A1A'}, {t: String(nR), sz: 14, b: 1, c: 'FFFFFF', fill: '1A1A1A'}, {t: String(nA), sz: 14, b: 1, c: 'FFFFFF', fill: '1A1A1A'}]});
    return head(idc, 'Desviaciones analizadas', 'Resumen') + table(idc(), 'Desviaciones', 0.5, 1.2, cw, rows) +
      shape(idc(), 'Nota', 0.5, 4.5, 9, 0.35, `<a:p><a:pPr algn="l"/>${run('■ ', {sz: 12, c: 'F07F00'})}${run('Cada desviación se analiza con Ishikawa (causas inmediatas), 5 porqués (causa raíz) y un plan de acción.', {sz: 12, c: GRAY})}</a:p>`, {ins: 0});
  });

  devs.forEach(d => {
    // 3) Descripción con tarjetas
    mk(idc => {
      let s = head(idc, 'Descripción de la desviación', devTag(d)) + sub(idc, d);
      const big = fitText(d.que, 4.9, 2.7, [24, 22, 20, 18, 16, 14, 12]);
      s += card(idc, 0.5, 1.2, 5.3, 3.65,
        para('Qué ocurrió', {sz: 14, b: 1, c: '1A1A1A'}) + para(big.t, {sz: big.sz, c: '1A1A1A', sb: 8}), {name: 'Qué ocurrió'});
      const side = [['Dónde y cuándo', (d.ambito ? d.ambito + ' · ' : '') + (d.donde || '—'), 'F07F00'], ['Impacto', d.impacto || '—', '595959'], ['Evidencia', d.evidencia || '—', GREY_BAR]];
      side.forEach((sd, i) => {
        const y = 1.2 + i * 1.275, f = fitText(sd[1], 3.1, 0.62, [12, 11, 10]);
        s += card(idc, 6.0, y, 3.5, 1.1, para(sd[0], {sz: 13, b: 1, c: '1A1A1A'}) + para(f.t, {sz: f.sz, c: GRAY, sb: 3}), {name: sd[0], ins: 0.14});
        s += dot(idc, 6.0 + 3.5 - 0.3, y + 0.14, 0.16, sd[2]);
      });
      return s;
    });
    // 4) Ishikawa
    mk(idc => head(idc, 'Diagrama de Ishikawa', devTag(d)) + sub(idc, d) + ishikawa(d, idc));
    // 5) 5 porqués
    {
      const cw = [1.3, 2.0, 3.6, 2.1], sz = 10;
      const rowsD = d.causes.map(c => ({c, whys: c.whys.length ? c.whys.map((w, i) => (i + 1) + '. ' + w) : ['—']}));
      const hs = rowsD.map(r => estRow([r.c.catName, r.c.t, r.whys, r.c.root], cw, sz));
      const pages = chunkRows(rowsD, hs, 3.5);
      pages.forEach((pg, pi) => mk(idc => {
        const rows = [hdr(['Categoría', 'Causa inmediata', 'Cadena de porqués', 'Causa raíz'], 11)].concat(pg.map((r, i) => ({h: 0.45, cells: [
          {t: r.c.catName, sz, b: 1, anchor: 't', fill: zebra(i)}, {t: r.c.t, sz, anchor: 't', fill: zebra(i)},
          {t: r.whys, sz, anchor: 't', fill: zebra(i)}, {t: r.c.root || '—', sz, b: 1, c: ROOT, anchor: 't', fill: zebra(i)}]})));
        const title = 'Análisis de 5 porqués' + (pages.length > 1 ? ` (${pi + 1}/${pages.length})` : '');
        return head(idc, title, devTag(d)) + sub(idc, d) + table(idc(), '5 porqués', 0.5, 1.12, cw, rows);
      }));
    }
    // 6) Plan de acción
    {
      const cw = [1.9, 2.5, 1.2, 0.85, 1.65, 0.9], sz = 10;
      const flat = [];
      d.causes.forEach(c => { if (!c.root) return; (c.acc.length ? c.acc : [null]).forEach((a, i) => flat.push({c, a, first: i === 0})); });
      const hs = flat.map(r => estRow([r.first ? r.c.root : '', r.a ? r.a.a : '—', r.a ? r.a.r : '', r.a ? r.a.f : '', r.a ? r.a.i : '', r.a ? r.a.e : ''], cw, sz));
      const pages = chunkRows(flat, hs, 3.5);
      pages.forEach((pg, pi) => mk(idc => {
        const rows = [hdr(['Causa raíz', 'Acción', 'Responsable', 'Fecha', 'Indicador de cierre', 'Estado'], 11)].concat(pg.map((r, i) => ({h: 0.45, cells: [
          {t: r.first ? r.c.root : '', sz, b: 1, c: ROOT, anchor: 't', fill: zebra(i)}, {t: r.a ? r.a.a : '—', sz, anchor: 't', fill: zebra(i)},
          {t: r.a ? r.a.r : '', sz, anchor: 't', fill: zebra(i)}, {t: r.a ? r.a.f : '', sz, anchor: 't', fill: zebra(i)}, {t: r.a ? r.a.i : '', sz, anchor: 't', fill: zebra(i)},
          {t: r.a ? r.a.e : '', sz, b: 1, al: 'ctr', anchor: 't', fill: r.a ? (ESTADO_FILL[r.a.e] || LIGHT) : zebra(i)}]})));
        const title = 'Plan de acción' + (pages.length > 1 ? ` (${pi + 1}/${pages.length})` : '');
        return head(idc, title, devTag(d)) + sub(idc, d) + table(idc(), 'Plan de acción', 0.5, 1.12, cw, rows);
      }));
    }
  });

  // 7) Conclusiones en tarjetas
  if (D.concl && D.concl.trim()) {
    const items = D.concl.split(/\n+/).map(x => x.trim()).filter(Boolean).slice(0, 4);
    mk(idc => {
      let s = head(idc, 'Conclusiones', 'Resumen');
      const h = Math.min(1.5, (3.65 - 0.2 * (items.length - 1)) / items.length);
      items.forEach((t, i) => {
        const y = 1.2 + i * (h + 0.2), f = fitText(t, 8.0, h - 0.3, [18, 16, 14, 12]);
        s += card(idc, 0.5, y, 9, h, para(f.t, {sz: f.sz, c: '1A1A1A'}), {name: 'Conclusión ' + (i + 1), anchor: 'ctr', ins: 0.45});
        s += dot(idc, 0.5 + 0.12, y + h / 2 - 0.08, 0.16, i === 0 ? 'F07F00' : (i === 1 ? '595959' : GREY_BAR));
      });
      return s;
    });
  }
  return out;
}

/* ---------- ensamblado del .pptx ---------- */
async function buildPptx(D, tplB64, JSZip) {
  if (!D.devs.length) throw new Error('No hay desviaciones para exportar.');
  const zip = await JSZip.loadAsync(tplB64, {base64: true});
  // portada
  let s1 = await zip.file('ppt/slides/slide1.xml').async('string');
  const m = D.meta || {};
  const title = '<a:p><a:r><a:rPr lang="es-CL" dirty="0"/><a:t>Análisis de desviaciones</a:t></a:r></a:p><a:p><a:r><a:rPr lang="es-CL" sz="1400" b="0" dirty="0"><a:solidFill><a:srgbClr val="595959"/></a:solidFill></a:rPr><a:t>Ishikawa · 5 porqués · Plan de acción</a:t></a:r></a:p>';
  s1 = s1.replace('<a:p><a:endParaRPr lang="es-CL"/></a:p>', title);
  const info = [['Área', m.area], ['Integrantes', m.nombre], ['Responsable', m.resp], ['Fecha', m.fecha]].filter(x => x[1]);
  const infoXml = shape(10, 'Datos generales', 0.29, 3.05, 3.0, 1.4,
    info.map((x, i) => `<a:p><a:pPr algn="l">${i ? '<a:spcBef><a:spcPts val="300"/></a:spcBef>' : ''}</a:pPr>${run(x[0] + ': ', {sz: 11, b: 1, c: DARK})}${run(x[1], {sz: 11, c: GRAY})}</a:p>`).join(''), {ins: 0});
  s1 = s1.replace('</p:spTree>', infoXml + '</p:spTree>');
  zip.file('ppt/slides/slide1.xml', s1);

  // diapositivas nuevas
  const slides = buildSlides(D);
  let rels = await zip.file('ppt/_rels/presentation.xml.rels').async('string');
  let ct = await zip.file('[Content_Types].xml').async('string');
  let pres = await zip.file('ppt/presentation.xml').async('string');
  const ids = [];
  slides.forEach((xml, i) => {
    const num = 3 + i;
    zip.file(`ppt/slides/slide${num}.xml`, xml);
    zip.file(`ppt/slides/_rels/slide${num}.xml.rels`, '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideLayout" Target="../slideLayouts/slideLayout3.xml"/></Relationships>');
    rels = rels.replace('</Relationships>', `<Relationship Id="rId${100 + i}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slide" Target="slides/slide${num}.xml"/></Relationships>`);
    ct = ct.replace('</Types>', `<Override PartName="/ppt/slides/slide${num}.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slide+xml"/></Types>`);
    ids.push(`<p:sldId id="${300 + i}" r:id="rId${100 + i}"/>`);
  });
  pres = pres.replace('<p:sldId id="272" r:id="rId4"/>', ids.join('') + '<p:sldId id="272" r:id="rId4"/>');
  zip.file('ppt/_rels/presentation.xml.rels', rels);
  zip.file('[Content_Types].xml', ct);
  zip.file('ppt/presentation.xml', pres);
  return zip.generateAsync({type: 'uint8array', compression: 'DEFLATE', compressionOptions: {level: 6}});
}

root.MIRSPptx = {buildPptx};
if (typeof module !== 'undefined' && module.exports) module.exports = {buildPptx};
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>

const FDB = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    try { const r = indexedDB.open('mirs-desviaciones-adjuntos', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('files');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch(e) { rej(e); }
  }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => {
    const t = db.transaction('files', mode), out = fn(t.objectStore('files'));
    t.oncomplete = () => res(out ? out.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); };
  return {
    put:(id, blob) => tx('readwrite', s => { s.put(blob, id); }),
    get:id => tx('readonly', s => s.get(id)),
    del:ids => tx('readwrite', s => { ids.forEach(i => s.delete(i)); }),
    clear:() => tx('readwrite', s => { s.clear(); })
  };
})();
const MAXF = 15 * 1024 * 1024;
const urlCache = {};
const fsize = n => n < 1024 ? n + ' B' : n < 1048576 ? Math.round(n / 1024) + ' KB' : (n / 1048576).toFixed(1).replace('.', ',') + ' MB';
const extOf = n => { const m = /\.([a-z0-9]{1,5})$/i.exec(n || ''); return m ? m[1].toUpperCase() : 'ARCHIVO'; };
const isImg = e => /^image\/(jpeg|png|webp|gif|bmp)$/i.test(e.type || '');
async function blobUrl(id){ if (urlCache[id]) return urlCache[id]; const b = await FDB.get(id); if (!b) return null; return urlCache[id] = URL.createObjectURL(b); }
const toDataUrl = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
function fromDataUrl(u){
  const m = /^data:([^;,]*)(;base64)?,(.*)$/s.exec(u || ''); if (!m) return null;
  if (!m[2]) return new Blob([decodeURIComponent(m[3])], {type:m[1]});
  const bin = atob(m[3]), a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);

}
const loadImg = f => new Promise((res, rej) => { const u = URL.createObjectURL(f), i = new Image(); i.onload = () => { URL.revokeObjectURL(u); res(i); }; i.onerror = e => { URL.revokeObjectURL(u); rej(e); }; i.src = u; });
async function prepFile(f){
  const type = f.type || '';
  if (/^image\//.test(type) && !/svg|gif/.test(type)) {
    try {
      const im = await loadImg(f), w = im.naturalWidth, h = im.naturalHeight, k = Math.min(1, 1600 / Math.max(w, h));
      if (k < 1 || f.size > 900000 || !isImg({type})) {
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
        const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
        if (b && (b.size < f.size || !isImg({type}))) return {blob:b, name:(f.name || 'foto').replace(/\.[^.]+$/, '') + '.jpg', type:'image/jpeg'};
      }

}
async function addFiles(di, files){

/* ---------- Ishikawa (SVG) ---------- */
function wrap(s, max, lines){
  const w = s.trim().split(/\s+/), out = [];
  let cur = '';
  for (const x of w){
    if ((cur + ' ' + x).trim().length <= max) cur = (cur + ' ' + x).trim();
    else { if (cur) out.push(cur); cur = x; }
  }
  if (cur) out.push(cur);
  let r = out.slice(0, lines);
  if (out.length > lines) r[lines - 1] = r[lines - 1].slice(0, max - 1) + '…';
  return r.map(l => l.length > max ? l.slice(0, max - 1) + '…' : l);
}
function fish(d, sfx){
  const W = 900, top = 8, bh = 30;
  const n = Math.max(3, ...CATS.map(c => d.causas[c.k].filter(x => x.t.trim()).length));
  const L = n * 40 + 30, sy = top + bh + L, H = sy + L + bh + top;
  const cols = [170, 400, 630];
  let s = `<svg viewBox="0 0 ${W} ${H}" class="fish" role="img" aria-label="Diagrama de Ishikawa">`;
  s += `<defs><marker id="fa${sfx}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fa" d="M0 0L10 5L0 10z"/></marker></defs>`;
  s += `<line class="fl" x1="20" y1="${sy}" x2="760" y2="${sy}" marker-end="url(#fa${sfx})"/>`;
  CATS.forEach((c, ci) => {
    const up = ci < 3, cx = cols[ci % 3];
    const boxY = up ? top : sy + L;
    const outer = up ? top + bh : sy + L;
    s += `<line class="fl" x1="${cx}" y1="${outer}" x2="${cx + 60}" y2="${sy}"/>`;
    s += `<rect class="bx" x="${cx - 75}" y="${boxY}" width="150" height="${bh}" rx="8"/>`;
    s += `<text class="cn" x="${cx}" y="${boxY + 19}" text-anchor="middle">${esc(c.n)}</text>`;
    d.causas[c.k].filter(x => x.t.trim()).forEach((x, i) => {
      const y = up ? top + bh + 34 + i * 40 : sy + L - 34 - i * 40;
      const xb = up ? cx + 60 * (y - (top + bh)) / L : cx + 60 * (sy + L - y) / L;
      s += `<line class="rib" x1="${(xb - 148).toFixed(1)}" y1="${y}" x2="${xb.toFixed(1)}" y2="${y}"/>`;
      const ls = wrap(x.t, 24, 2);
      ls.forEach((l, li) => {
        const ty = ls.length === 1 ? y - 5 : y - 17 + li * 12;
        s += `<text class="ct" x="${(xb - 146).toFixed(1)}" y="${ty}">${esc(l)}</text>`;
      });
    });
  });
  const has = d.titulo.trim();
  const el = wrap(has || 'Escribe la desviación (paso 1)', 17, 5);
  s += `<rect class="eb" x="760" y="${sy - 52}" width="132" height="104" rx="10"/>`;
  el.forEach((l, i) => { s += `<text class="en${has ? '' : ' ph'}" x="826" y="${(sy - (el.length - 1) * 8 + 4 + i * 16).toFixed(1)}" text-anchor="middle">${esc(l)}</text>`; });
  return s + '</svg>';
}

        <button class="dlink${d.titulo.trim() ? '' : ' vacio'}" data-act="open" data-i="${i}">${esc(d.titulo.trim() || 'Sin título todavía')}</button>
        ${meta ? `<div class="dmeta">${meta}</div>` : ''}
        <div class="prog" title="Descripción · Ishikawa · 5 porqués · Plan de acción">${st.segs.map((ok, k) => `<i class="${ok ? 'ok' : ''}" title="${STEPS[k]}${ok ? ' ✓' : ''}"></i>`).join('')}</div>
        <div class="dchips">${st.nC} causa(s) inmediata(s) · ${st.roots}/${st.nC} causa(s) raíz · ${st.acc} acción(es)${st.acc ? ` (${st.done} cerrada${st.done === 1 ? '' : 's'})` : ''}${(d.evid || []).length ? ` · 📎 ${d.evid.length} archivo(s)` : ''}</div>
      </div>
      <div class="dside"><span class="pill ${st.est[1]}">${st.est[0]}</span>
        <button class="btn sm" data-act="open" data-i="${i}">Abrir</button>
        <button class="btn sm del" data-act="deldev" data-i="${i}">Eliminar</button></div>
    </article>`;
  }).join('');
}
function listPanel(){
  if (!S.devs.length) return `<section class="vista"><div class="tarjeta vacio-box">
    <h3>Aún no hay desviaciones</h3>
    <p>Crea la primera para empezar el análisis: descripción, Ishikawa, 5 porqués y plan de acción. Puedes agregar todas las que necesites.</p>
    <div class="fila"><button class="btn pri" data-act="newdev">＋ Nueva desviación</button><button class="btn" data-act="imp">Importar avance (.json)</button></div>
    <p class="nota">${esc(storeMsg())}</p></div></section>`;
  return `<section class="vista">
    <div class="lhead">${secH(S.devs.length, 'Desviaciones', 'Toca una para continuar su análisis')}
      <input type="search" id="q" data-q="1" placeholder="Buscar por título, ámbito o lugar" value="${esc(ui.q)}" aria-label="Buscar desviación">
      <button class="btn pri" data-act="newdev">＋ Nueva desviación</button></div>
    <div class="dlist" id="dlist">${listItems()}</div>
  </section>`;
}

function devPanel(di){
  const d = S.devs[di], L = causeList(d);
  const roots = L.filter(c => rootOf(d, c.id)).length;
  const accs = L.reduce((n, c) => n + ((d.acciones[c.id] || []).filter(a => a.a.trim()).length), 0);
  const badge = [d.titulo.trim() ? '✓' : '', L.length || '', roots || '', accs || ''];
  const pills = STEPS.map((t, i) => `<button class="step${ui.step === i + 1 ? ' on' : ''}" data-act="step" data-s="${i + 1}">${i + 1}. ${t}${badge[i] !== '' ? `<small>(${badge[i]})</small>` : ''}</button>`).join('');
  const body = [step1, step2, step3, step4][ui.step - 1](di);
  const prev = ui.step > 1 ? `<button class="btn" data-act="step" data-s="${ui.step - 1}">← ${STEPS[ui.step - 2]}</button>` : '<span></span>';
  const next = ui.step < 4 ? `<button class="btn pri" data-act="step" data-s="${ui.step + 1}">${STEPS[ui.step]} →</button>`
    : (di < S.devs.length - 1 ? `<button class="btn pri" data-act="open" data-i="${di + 1}">Desviación ${di + 2} →</button>`
      : `<span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="newdev">＋ Nueva desviación</button><button class="btn pri" data-act="tab" data-t="res">Ver resumen →</button></span>`);
  const jump = S.devs.length > 1 ? `<select id="jump" aria-label="Ir a otra desviación">${S.devs.map((x, i) => `<option value="${i}"${i === di ? ' selected' : ''}>${esc(devTitle(x, i).slice(0, 70))}</option>`).join('')}</select>` : '';
  return `<section class="vista">
    <div class="devtop"><button class="btn sm" data-act="tab" data-t="list">← Todas las desviaciones</button>${jump}<span class="grow"></span>
      <button class="btn sm del" data-act="deldev" data-i="${di}">Eliminar esta desviación</button></div>
    <div class="tarjeta">${secH(di + 1, esc(devTitle(d, di)))}<div class="steps">${pills}</div>${body}<div class="nav">${prev}${next}</div></div></section>`;
}

function step1(di){
  const p = `devs.${di}.`;
  return `<div class="rejilla">
    ${fld('Título de la desviación', p + 'titulo', {cls:'full', ph:'Ej.: resultado fuera de tolerancia, derrame, falla de equipo…'})}
    ${fld('Ámbito', p + 'ambito', {sel:['Faena','Laboratorio']})}
    ${fld('Dónde y cuándo se detectó', p + 'donde')}
    ${fld('Qué ocurrió (estándar esperado vs. situación real)', p + 'que', {ta:1, rows:4, cls:'full'})}
    ${fld('Impacto (seguridad, calidad, producción, costo, ambiente)', p + 'impacto', {ta:1})}
    ${fld('Evidencia (registro, dato, foto, informe)', p + 'evidencia', {ta:1, ph:'Describe la evidencia y adjunta los archivos abajo'})}
    ${evidBlock(di)}
  </div>`;
}
function evidBlock(di){
  const ev = S.devs[di].evid || [];
  return `<div class="full evid"><div class="campo"><span>Archivos de evidencia${ev.length ? ' (' + ev.length + ')' : ''}</span></div>
    <label class="drop" id="drop"><input type="file" id="fEvid" data-d="${di}" multiple accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.msg,.eml,.zip">
      <b>＋ Adjuntar archivos</b><small>Toca para elegir o arrastra aquí · fotos, PDF, Word, Excel… · máx. 15 MB por archivo</small></label>
    ${ev.length ? `<div class="egrid">${ev.map(x => `<div class="ecard">
      ${isImg(x) ? `<div class="eth" data-thumb="${x.id}"></div>` : `<div class="eth ico">${esc(extOf(x.name))}</div>`}
      <div class="einfo"><span class="ename" title="${esc(x.name)}">${esc(x.name)}</span><small>${fsize(x.size)}${x.added ? ' · ' + fdate(x.added) : ''}</small></div>
      <div class="ebtn"><button class="btn sm" data-act="evopen" data-d="${di}" data-id="${x.id}">${isImg(x) || /pdf/.test(x.type) ? 'Ver' : 'Descargar'}</button>
        <button class="x" title="Quitar archivo" aria-label="Quitar archivo" data-act="evdel" data-d="${di}" data-id="${x.id}">✕</button></div></div>`).join('')}</div>` : ''}
    <p class="nota" style="margin:0">Los archivos se guardan en este equipo. Para enviarlos a un compañero, «Exportar» los incluye en el archivo .json.</p></div>`;
}

function step2(di){
  const d = S.devs[di];
  const cards = CATS.map(c => `<div class="sub"><h4>${c.n}</h4><p class="muted small" style="margin:0 0 4px">${c.h}</p>
    ${d.causas[c.k].map((x, i) => `<div class="row"><input type="text" id="f-${x.id}" data-id="${x.id}" data-f="devs.${di}.causas.${c.k}.${i}.t" value="${esc(x.t)}" placeholder="Causa inmediata">
      <button class="x" title="Quitar" aria-label="Quitar causa" data-act="delcause" data-d="${di}" data-c="${c.k}" data-id="${x.id}">✕</button></div>`).join('')}
    <button class="btn sm" data-act="addcause" data-d="${di}" data-c="${c.k}">＋ Agregar causa</button></div>`).join('');
  return `<div class="sub"><h3>Diagrama de Ishikawa (se dibuja solo)</h3>
    <p class="muted small" style="margin:0 0 8px">Escribe abajo las causas inmediatas en la categoría que corresponda. Las categorías sin causas se dejan vacías.</p>
    <div id="fishwrap">${fish(d, 'v')}</div></div>
    <div class="cats">${cards}</div>`;
}

function step3(di){
  const d = S.devs[di], L = causeList(d);
  if (!L.length) return `<div class="banner">Primero escribe al menos una causa inmediata en el paso 2 (Ishikawa).</div>`;
  return `<div class="banner">Cada causa inmediata del Ishikawa aparece aquí sola. Responde «¿por qué?» hasta llegar a la causa raíz. Si la encuentras antes del 5.º porqué, deja los demás vacíos. La causa raíz se completa sola con tu último porqué y puedes editarla.</div>` +
  L.map(c => {
    const w = ensureWhy(d, c.id), b = `devs.${di}.whys.${c.id}.`;
    return `<div class="sub why"><div class="whyhead"><span class="tag">${esc(catName(c.k))}</span><strong>${esc(c.t)}</strong></div>
      ${w.w.map((x, i) => `<label class="campo inline"><span>¿Por qué? ${i + 1}</span><input type="text" id="f-${c.id}-w${i}" data-f="${b}w.${i}" value="${esc(x)}" placeholder="${i ? 'Porque…' : '¿Por qué ocurre esta causa inmediata?'}"></label>`).join('')}
      <label class="campo root" style="margin-top:8px"><span>Causa raíz</span><textarea id="f-${c.id}-root" data-root="${c.id}" data-f="${b}root" rows="2" placeholder="Se completa sola con el último porqué">${esc(w.root)}</textarea></label></div>`;
  }).join('');
}

function step4(di){
  const d = S.devs[di], L = causeList(d);
  const withRoot = L.filter(c => { ensureWhy(d, c.id); return rootOf(d, c.id); });
  if (!withRoot.length) return `<div class="banner">Aún no hay causas raíz. Completa los 5 porqués (paso 3) y aparecerán aquí solas.</div>`;
  const miss = L.length - withRoot.length;
  return (miss ? `<div class="banner falta">Faltan causas raíz en ${miss} causa(s) inmediata(s) (paso 3).</div>` : '') +
  withRoot.map(c => {
    const w = d.whys[c.id], acs = ensureAcc(d, c.id);
    return `<div class="sub"><div class="whyhead"><span class="tag raiz">Causa raíz</span><strong>${esc(w.root)}</strong>
      <div class="muted small" style="margin-top:4px">Causa inmediata: ${esc(c.t)} (${esc(catName(c.k))})</div></div>
      ${acs.map((a, i) => { const b = `devs.${di}.acciones.${c.id}.${i}.`; return `<div class="acc">
        ${fld('Acción correctiva / preventiva', b + 'a')}
        ${fld('Responsable', b + 'r')}
        ${fld('Fecha compromiso', b + 'f', {type:'date'})}
        ${fld('Indicador o evidencia de cierre', b + 'i')}
        ${fld('Estado', b + 'e', {sel:ESTADOS, est:1})}
        <button class="x" title="Quitar acción" aria-label="Quitar acción" data-act="delacc" data-d="${di}" data-id="${c.id}" data-i="${i}" style="height:38px">✕</button></div>`; }).join('')}
      <button class="btn sm" data-act="addacc" data-d="${di}" data-id="${c.id}">＋ Agregar otra acción</button></div>`;
  }).join('');
}

function planTable(d, forPrint){
  const rows = planRows(d);
  if (!rows.length) return '<p class="muted">Sin causas inmediatas todavía.</p>';
  return `<div class="desliza"><table class="lista"><thead><tr><th>Causa inmediata</th><th>Causa raíz</th><th>Acción</th><th>Responsable</th><th>Fecha</th>${forPrint ? '<th>Indicador / evidencia</th>' : ''}<th>Estado</th></tr></thead><tbody>
  ${rows.map(r => `<tr>${r.first ? `<td rowspan="${r.span}">${esc(r.c.t)}<br><span class="muted small">${esc(catName(r.c.k))}</span></td><td rowspan="${r.span}">${esc(r.root) || '—'}</td>` : ''}
    <td>${r.a ? esc(r.a.a) : '—'}</td><td>${r.a ? esc(r.a.r) : ''}</td><td>${r.a ? fdate(r.a.f) : ''}</td>${forPrint ? `<td>${r.a ? esc(r.a.i) : ''}</td>` : ''}<td>${r.a ? `<span class="est est-${slug(r.a.e)}">${esc(r.a.e)}</span>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
}

function resPanel(){
  let nC = 0, nR = 0, nA = 0, nDone = 0;
  S.devs.forEach(d => { const st = devStats(d); nC += st.nC; nR += st.roots; nA += st.acc; nDone += st.done; });
  return `<section class="vista">
  ${pptCard()}
  <div class="stats"><div class="stat o"><b>${S.devs.length}</b>desviaciones</div><div class="stat"><b>${nC}</b>causas inmediatas</div><div class="stat p"><b>${nR}</b>causas raíz</div><div class="stat v"><b>${nA}</b>acciones (${nDone} cerradas)</div></div>
  ${S.devs.length ? S.devs.map((d, i) => `<div class="tarjeta">${secH(i + 1, esc(devTitle(d, i)))}${planTable(d, false)}
     <div style="margin-top:10px"><button class="btn sm" data-act="open" data-i="${i}">Abrir desviación</button></div></div>`).join('')
    : `<div class="tarjeta"><p class="muted" style="margin:0">Aún no hay desviaciones. <button class="btn sm" data-act="newdev">＋ Nueva desviación</button></p></div>`}
  <div class="tarjeta">${secH('✓', 'Conclusiones', 'Qué patrón común aparece entre las causas raíz y qué acción tendría más impacto. Cada línea es una conclusión en la PPT (máx. 4).')}
    <label class="campo"><textarea id="f-conclusiones" data-f="conclusiones" rows="4">${esc(S.conclusiones)}</textarea></label></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn pri" data-act="print">Vista completa</button>${WEB ? '<button class="btn pri" data-act="pdf">Exportar PDF</button>' : '<button class="btn" data-act="informe">Descargar informe (HTML para PDF)</button>'}<button class="btn" data-act="csv">Descargar tabla (CSV para Excel)</button></div>
  </section>`;
}

function tabsHTML(){
  const t = [['meta','Datos generales'], ['list','Desviaciones'], ['res','Resumen']];
  return `<nav class="tabs">${t.map(([k, n]) => `<button class="tab${ui.tab === k || (k === 'list' && ui.tab === 'dev') ? ' on' : ''}" data-act="tab" data-t="${k}">${n}${k === 'list' ? ` <span class="cnt">${S.devs.length}</span>` : ''}</button>`).join('')}</nav>`;
}
function render(){
  let p;
  if (ui.tab === 'meta') p = metaPanel();
  else if (ui.tab === 'res') p = resPanel();
  else if (ui.tab === 'dev' && S.devs[ui.di]) p = devPanel(ui.di);
  else { ui.tab = 'list'; p = listPanel(); }
  app.innerHTML = '<div class="wrap">' + tabsHTML() + p + '</div>';
  fillThumbs();
  if (ui.focus){ const el = app.querySelector(`[data-id="${ui.focus}"]`) || document.getElementById(ui.focus); if (el && el.focus) el.focus(); ui.focus = null; }
}
const top0 = () => window.scrollTo(0, 0);

/* ---------- eventos ---------- */
function setP(path, val){
  const p = path.split('.'), last = p.pop();
  p.reduce((o, k) => o[k], S)[last] = val;
}
app.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.q){ ui.q = t.value; const l = document.getElementById('dlist'); if (l) l.innerHTML = listItems(); return; }
  const f = t.dataset && t.dataset.f;
  if (!f) return;
  const p = f.split('.');
  setP(f, t.value);
  if (t.tagName === 'SELECT' && t.classList.contains('est')) t.className = 'est est-' + slug(t.value);
  if (p[0] === 'devs'){
    const di = +p[1], d = S.devs[di];
    if (p[2] === 'titulo' || p[2] === 'causas'){ const w = app.querySelector('#fishwrap'); if (w) w.innerHTML = fish(d, 'v'); }
    if (p[2] === 'titulo'){ const h = app.querySelector('.sec-h .tt'); if (h) h.textContent = devTitle(d, di); }
    if (p[2] === 'whys'){
      const w = d.whys[p[3]];
      if (p[4] === 'w' && !w.edited){
        w.root = lastWhy(w);
        const ta = app.querySelector(`[data-root="${p[3]}"]`); if (ta) ta.value = w.root;
      }
      if (p[4] === 'root') w.edited = t.value.trim() !== '';
      if (p[4] === 'root' && !w.edited){ w.root = lastWhy(w); }
    }
  }
  save();
});
app.addEventListener('change', e => {
  if (e.target.id === 'fEvid'){ const files = [...e.target.files]; const di = +e.target.dataset.d; e.target.value = ''; addFiles(di, files); return; }
  if (e.target.id === 'jump'){ ui.tab = 'dev'; ui.di = +e.target.value; ui.step = 1; render(); top0(); }
});
app.addEventListener('dragover', e => { const z = e.target.closest && e.target.closest('#drop'); if (z) z.classList.add('over'); });
app.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('#drop'); if (z) z.classList.remove('over'); });
app.addEventListener('drop', e => { const z = e.target.closest && e.target.closest('#drop'); if (z) z.classList.remove('over'); });
function openDev(i){ ui.tab = 'dev'; ui.di = i; ui.step = 1; render(); top0(); }
app.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act, di = +b.dataset.d;
  if (a === 'tab'){ ui.tab = b.dataset.t; ui.step = 1; render(); top0(); }
  else if (a === 'open') openDev(+b.dataset.i);
  else if (a === 'step'){ ui.step = +b.dataset.s; render(); top0(); }
  else if (a === 'newdev'){ S.devs.push(newDev()); save(); ui.tab = 'dev'; ui.di = S.devs.length - 1; ui.step = 1; ui.focus = 'f-devs-' + ui.di + '-titulo'; render(); top0(); toast('Desviación ' + S.devs.length + ' creada'); }
  else if (a === 'deldev'){
    const i = +b.dataset.i, d = S.devs[i]; if (!d) return;
    const st = devStats(d);
    const ok = await ask('¿Eliminar la desviación ' + (i + 1) + '?',
      `<p style="margin:0 0 6px"><b>${esc(d.titulo.trim() || 'Sin título')}</b></p><p style="margin:0">Se borrarán su descripción, ${st.nC} causa(s), ${st.roots} causa(s) raíz y ${st.acc} acción(es). No se puede deshacer; si quieres conservarla, primero usa «Exportar».</p>`,
      'Eliminar desviación', true);
    if (!ok || S.devs[i] !== d) return;
    S.devs.splice(i, 1); save(); FDB.del((d.evid || []).map(x => x.id)).catch(() => {});
    if (ui.tab === 'dev') ui.tab = 'list';
    render(); toast('Desviación eliminada');
  }
  else if (a === 'addcause'){ const x = {id:uid(), t:''}; S.devs[di].causas[b.dataset.c].push(x); ui.focus = x.id; save(); render(); }
  else if (a === 'delcause'){
    const d = S.devs[di], ck = b.dataset.c, id = b.dataset.id;
    const hasWork = (d.whys[id] && (rootOf(d, id) || d.whys[id].w.some(x => x.trim()))) || (d.acciones[id] && d.acciones[id].some(x => x.a.trim()));
    if (hasWork && !(await ask('¿Quitar esta causa?', 'Esta causa inmediata ya tiene porqués o acciones. Si la quitas, también se borran.', 'Quitar causa', true))) return;
    d.causas[ck] = d.causas[ck].filter(x => x.id !== id);
    if (!d.causas[ck].length) d.causas[ck].push({id:uid(), t:''});
    delete d.whys[id]; delete d.acciones[id]; save(); render();
  }
  else if (a === 'addacc'){ S.devs[di].acciones[b.dataset.id].push({a:'', r:'', f:'', i:'', e:'Pendiente'}); save(); render(); }
  else if (a === 'delacc'){
    const arr = S.devs[di].acciones[b.dataset.id], x = arr[+b.dataset.i];
    if (x && (x.a.trim() || x.r.trim() || x.i.trim()) && !(await ask('¿Quitar esta acción?', `<b>${esc(x.a.trim() || 'Acción sin descripción')}</b>`, 'Quitar acción', true))) return;
    arr.splice(+b.dataset.i, 1); save(); render();
  }
  else if (a === 'print') openVista();
  else if (a === 'informe') descargarInforme();
  else if (a === 'pdf') exportPdf();
  else if (a === 'csv') exportCsv();
  else if (a === 'ppt') generarPpt();
  else if (a === 'imp') document.getElementById('fImp').click();
  else if (a === 'evopen'){
    const d = S.devs[di], x = d && (d.evid || []).find(y => y.id === b.dataset.id); if (!x) return;
    let blob; try { blob = await FDB.get(x.id); } catch(err) {}
    if (!blob){ inform('Archivo no disponible', 'Este archivo no está guardado en este equipo. Pídele a quien lo adjuntó que te envíe su «Exportar» (.json) e impórtalo.'); return; }
    let w = null;
    if (WEB && (isImg(x) || /pdf/.test(x.type))) { try { w = window.open(await blobUrl(x.id), '_blank'); } catch(err) {} }
    if (!w) dl(x.name, x.type, blob);
  }
  else if (a === 'evdel'){
    const d = S.devs[di], x = d && (d.evid || []).find(y => y.id === b.dataset.id); if (!x) return;
    if (!(await ask('¿Quitar este archivo?', `<b>${esc(x.name)}</b><br>Se borrará de la evidencia de esta desviación.`, 'Quitar archivo', true))) return;
    d.evid = d.evid.filter(y => y.id !== x.id); FDB.del([x.id]).catch(() => {}); save(); render(); toast('Archivo quitado');
  }
});

/* ---------- vista completa / informe ---------- */
function buildPrint(urls = {}){
  const m = S.meta;
  const head = `<div class="phead"><img src="${LOGO}" alt="MIRS"><div class="pt"><h1>Análisis de Desviaciones</h1><small>Ishikawa · 5 porqués (RCA) · Plan de acción</small></div><div class="pr">${esc(m.area)}${m.fecha ? '<br>' + fdate(m.fecha) : ''}</div></div>`;
  const ttl = (d, di) => esc(devTitle(d, di));
  let h = `<table class="pw"><thead><tr><td>${head}</td></tr></thead><tbody><tr><td>`;
  h += `<section class="pg first"><h2>Datos generales</h2>
    <div class="desliza"><table class="lista"><tr><td class="k">Integrantes</td><td>${esc(m.nombre)}</td><td class="k">Área analizada</td><td>${esc(m.area)}</td></tr>
    <tr><td class="k">Responsable del área</td><td>${esc(m.resp)}</td><td class="k">Fecha del análisis</td><td>${fdate(m.fecha)}</td></tr></table></div>
    <h3>Contenido</h3>
    <div class="desliza"><table class="lista"><thead><tr><th>N°</th><th>Desviación</th><th>Ámbito</th><th>Causas inmediatas</th><th>Causas raíz</th><th>Acciones</th><th>Estado</th></tr></thead><tbody>
    ${S.devs.length ? S.devs.map((d, i) => { const st = devStats(d); return `<tr><td>${i + 1}</td><td>${esc(d.titulo) || '—'}</td><td>${esc(d.ambito)}</td><td>${st.nC}</td><td>${st.roots}</td><td>${st.acc}</td><td><span class="pill ${st.est[1]}">${st.est[0]}</span></td></tr>`; }).join('') : '<tr><td colspan="7">Sin desviaciones todavía.</td></tr>'}</tbody></table></div></section>`;
  S.devs.forEach((d, di) => {
    const L = causeList(d);
    h += `<section class="pg"><h2>${ttl(d, di)}</h2>
    <div class="desliza"><table class="lista"><tr><td class="k">Ámbito</td><td>${esc(d.ambito)}</td><td class="k">Dónde y cuándo</td><td>${esc(d.donde)}</td></tr>
    <tr><td class="k">Qué ocurrió</td><td colspan="3">${esc(d.que)}</td></tr><tr><td class="k">Impacto</td><td>${esc(d.impacto)}</td><td class="k">Evidencia</td><td>${esc(d.evidencia)}</td></tr></table></div>
    <h3>Diagrama de Ishikawa</h3><div class="fishp">${fish(d, 'p' + di)}</div></section>`;
    const ev = d.evid || [], pics = ev.filter(x => urls[x.id]), others = ev.filter(x => !urls[x.id]);
    if (ev.length) h += `<section class="pg"><h2>${ttl(d, di)}</h2><h3>Evidencia adjunta</h3>
      ${pics.length ? `<div class="pevid">${pics.map(x => `<figure><img src="${urls[x.id]}" alt="${esc(x.name)}"><figcaption>${esc(x.name)}</figcaption></figure>`).join('')}</div>` : ''}
      ${others.length ? `<p class="small"><b>Otros archivos:</b> ${others.map(x => esc(x.name)).join(' · ')}</p>` : ''}</section>`;
    h += `<section class="pg"><h2>${ttl(d, di)}</h2><h3>Análisis RCA: 5 porqués</h3>`;
    h += L.length ? `<div class="desliza"><table class="lista"><thead><tr><th>Categoría</th><th>Causa inmediata</th><th>¿Por qué? 1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>Causa raíz</th></tr></thead><tbody>
      ${L.map(c => { const w = d.whys[c.id] || {w:['','','','',''], root:''}; return `<tr><td>${esc(catName(c.k))}</td><td>${esc(c.t)}</td>${[0,1,2,3,4].map(i => `<td>${esc(w.w[i] || '')}</td>`).join('')}<td><b>${esc(w.root)}</b></td></tr>`; }).join('')}</tbody></table></div>` : '<p>—</p>';
    const plan = `<h3>Plan de acción</h3>${planTable(d, true)}`;
    h += L.length > 5 ? `</section><section class="pg"><h2>${ttl(d, di)}</h2>${plan}</section>` : `${plan}</section>`;
  });
  h += `<section class="pg"><h2>Resumen y conclusiones</h2>${S.devs.map((d, i) => `<h3>${ttl(d, i)}</h3>${planTable(d, false)}`).join('')}
  <h3>Conclusiones</h3><p>${esc(S.conclusiones).replace(/\n/g, '<br>') || '—'}</p></section>`;
  h += '</td></tr></tbody></table>';
  document.getElementById('print').innerHTML = h;
  return h;
}
async function openVista(){ buildPrint(await evidUrls(false)); const v = document.getElementById('vista'); v.hidden = false; v.scrollTop = 0; document.body.classList.add('noscroll'); document.getElementById('bCerrarVista').focus(); }
function closeVista(){ document.getElementById('vista').hidden = true; document.body.classList.remove('noscroll'); }
document.getElementById('bCerrarVista').onclick = closeVista;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.getElementById('vista').hidden && document.getElementById('modal').hidden) closeVista(); });
document.getElementById('bInforme').onclick = () => descargarInforme();
async function exportPdf(){
  if (!S.devs.length){ inform('Sin desviaciones', 'Crea al menos una desviación antes de exportar el PDF.'); return; }

  await imgsLoaded(document.getElementById('print'));

  ['bPdf','bPdf2'].forEach(id => { const b = document.getElementById(id); b.hidden = false; b.onclick = exportPdf; });

async function descargarInforme(){
  if (!S.devs.length){ inform('Sin desviaciones', 'Crea al menos una desviación antes de descargar el informe.'); return; }
  const body = buildPrint(await evidUrls(true));
  const css = document.getElementById('css').textContent;

  dl('MIRS-Analisis-de-Desviaciones.html', 'text/html', html);

/* ---------- presentación (PPT) ---------- */
function pptData(){
  const devs = [];
  S.devs.forEach((d, i) => {
    const L = causeList(d);
    if (!d.titulo.trim() && !L.length) return;
    devs.push({n:i + 1, titulo:d.titulo.trim(), ambito:d.ambito, donde:d.donde.trim(), que:d.que.trim(), impacto:d.impacto.trim(), evidencia:d.evidencia.trim(),
      causes:L.map(c => {
        const w = d.whys[c.id] || {w:[], root:''};
        const acc = (d.acciones[c.id] || []).filter(a => a.a.trim() || a.r.trim() || a.f || a.i.trim()).map(a => ({a:a.a.trim(), r:a.r.trim(), f:fdate(a.f), i:a.i.trim(), e:a.e}));
        return {cat:c.k, catName:catName(c.k), t:c.t, whys:w.w.map(x => x.trim()).filter(Boolean), root:rootOf(d, c.id), acc};
      }),
      fish:CATS.map(c => ({name:c.n, items:L.filter(x => x.k === c.k).map(x => x.t)}))});
  });
  const m = S.meta;
  return {meta:{nombre:m.nombre.trim(), area:m.area, resp:m.resp.trim(), fecha:fdate(m.fecha)}, devs, concl:S.conclusiones};
}
function readiness(){
  const w = []; let filled = 0;
  S.devs.forEach((d, i) => {
    const L = causeList(d);
    if (!d.titulo.trim() && !L.length) return;
    filled++;
    const p = 'Desviación ' + (i + 1) + ': ';
    if (!d.titulo.trim()) w.push(p + 'falta el título');
    if (!L.length){ w.push(p + 'falta al menos una causa inmediata'); return; }
    const sr = L.filter(c => !rootOf(d, c.id)).length;
    if (sr) w.push(p + sr + ' causa(s) inmediata(s) sin causa raíz');
    const sa = L.filter(c => rootOf(d, c.id) && !(d.acciones[c.id] || []).some(a => a.a.trim())).length;
    if (sa) w.push(p + sa + ' causa(s) raíz sin acción en el plan');
  });
  if (!filled) return {fatal:true, w:['Aún no hay ninguna desviación completada']};
  const empty = S.devs.length - filled;
  if (empty) w.push(empty + ' desviación(es) vacía(s) no se incluirán');
  return {fatal:false, w};
}
function pptCard(){
  const r = readiness();
  const ok = !r.fatal && !r.w.length;
  return `<div class="tarjeta">${secH('P', 'Presentación (PPT)', 'Se genera con la plantilla MIRS a partir de lo que completaste')}
    ${ok ? '<p style="margin:0 0 12px;color:var(--verdeTx)"><b>✓ Todo listo.</b> Las desviaciones tienen causas, causas raíz y acciones.</p>'
         : `<ul class="chk">${r.w.map(x => `<li>⚠ ${esc(x)}</li>`).join('')}</ul>`}
    <button class="btn pri" data-act="ppt">Generar PPT</button></div>`;
}
async function generarPpt(){
  const r = readiness();
  if (r.fatal){ inform('Falta información', esc(r.w[0]) + '. Completa al menos una desviación.'); return; }
  if (r.w.length && !(await ask('Aún falta completar', `<ul>${r.w.map(x => `<li>${esc(x)}</li>`).join('')}</ul>¿Generar la PPT de todas formas?`, 'Generar igual'))) return;
  const btns = [...document.querySelectorAll('#bPpt,[data-act=ppt]')];
  btns.forEach(b => { b.disabled = true; b.dataset.t = b.textContent; b.textContent = 'Generando…'; });
  try {
    const bytes = await window.MIRSPptx.buildPptx(pptData(), TPL_B64, window.JSZip);
    await dl('MIRS-Analisis-de-Desviaciones.pptx', 'application/vnd.openxmlformats-officedocument.presentationml.presentation', bytes);
  } catch(e){ console.error(e); inform('No se pudo generar la PPT', esc(e && e.message || e)); }
  finally { btns.forEach(b => { b.disabled = false; b.textContent = b.dataset.t; }); }
}
document.getElementById('bPpt').onclick = generarPpt;

/* ---------- descargas, exportar / importar ---------- */
let DLcap;
async function dl(name, type, content){
  const blob = content instanceof Blob ? content : new Blob([content], {type});
  try {
    if (DLcap === undefined) DLcap = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('downloads') : null;
  } catch(e) { DLcap = null; }
  if (DLcap) {
    try { await DLcap.save({filename:name, data:blob}); toast('Descargado: ' + name); }
    catch(e) {
      if (e && e.code === 'declined') return;
      if (e && e.code === 'rate_limited') { toast('Hay una descarga pendiente; acéptala o espera un momento.'); return; }
      inform('No se pudo descargar', esc((e && (e.message || e.code)) || 'Error desconocido'));
    }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}
function exportCsv(){
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const head = ['Desviación','Título','Ámbito','Categoría','Causa inmediata','Causa raíz','Acción','Responsable','Fecha','Indicador','Estado'];
  const rows = [head];
  S.devs.forEach((d, i) => planRows(d).forEach(r => rows.push([i + 1, d.titulo, d.ambito, catName(r.c.k), r.c.t, r.root, r.a ? r.a.a : '', r.a ? r.a.r : '', r.a ? fdate(r.a.f) : '', r.a ? r.a.i : '', r.a ? r.a.e : ''])));
  if (rows.length === 1){ inform('Sin datos', 'Aún no hay causas ni acciones para exportar.'); return; }
  dl('MIRS-plan-de-accion.csv', 'text/csv;charset=utf-8', '﻿' + rows.map(r => r.map(q).join(';')).join('\r\n'));
}
document.getElementById('bExp').onclick = async () => {
  const adj = {}; let falt = 0;
  for (const d of S.devs) for (const x of (d.evid || [])) { try { const b = await FDB.get(x.id); if (b) adj[x.id] = await toDataUrl(b); else falt++; } catch(e) { falt++; } }
  const n = Object.keys(adj).length;
  await dl('MIRS-desviaciones-avance.json', 'application/json', JSON.stringify(Object.assign({}, S, {adjuntos:adj}), null, n ? 0 : 2));
  if (falt) toast(falt + ' archivo(s) no estaban en este equipo y no se incluyeron');
};
async function importBlobs(o, devs){
  const adj = (o && o.adjuntos && typeof o.adjuntos === 'object') ? o.adjuntos : {};
  for (const d of devs) for (const x of (d.evid || [])) if (typeof adj[x.id] === 'string') { try { const b = fromDataUrl(adj[x.id]); if (b) await FDB.put(x.id, b); } catch(e) { console.error(e); } }
}
document.getElementById('bImp').onclick = () => document.getElementById('fImp').click();
document.getElementById('fImp').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    let o;
    try { o = JSON.parse(r.result); if (!o || !Array.isArray(o.devs)) throw 0; }
    catch(err){ inform('Archivo no válido', 'El archivo no es un avance exportado de este formato (.json).'); return; }
    const inc = normalize(o, true);
    if (!inc.devs.length && !S.devs.length && !inc.meta.nombre){ inform('Archivo vacío', 'El archivo no trae desviaciones con contenido.'); return; }
    let mode = 'rep';
    if (S.devs.length){
      mode = await choose('Importar avance', `El archivo trae <b>${inc.devs.length}</b> desviación(es). Tú ya tienes <b>${S.devs.length}</b>.<br><br>«Agregar» las suma al final de tu lista. «Reemplazar» borra lo actual y deja solo lo del archivo.`,
        [{v:null, label:'Cancelar'}, {v:'rep', label:'Reemplazar todo', cls:'peligro'}, {v:'add', label:'Agregar a las mías', cls:'pri'}]);
      if (!mode) return;
    }
    if (mode === 'add'){
      const ids = new Set(S.devs.map(d => d.id));
      inc.devs.forEach(d => { if (ids.has(d.id)) d.id = uid(); ids.add(d.id); S.devs.push(d); });
      for (const k in S.meta) if (!S.meta[k] && inc.meta[k]) S.meta[k] = inc.meta[k];
      if (inc.conclusiones && !S.conclusiones.includes(inc.conclusiones)) S.conclusiones = (S.conclusiones ? S.conclusiones + '\n' : '') + inc.conclusiones;
      toast(inc.devs.length + ' desviación(es) agregada(s)');
    } else { const old = []; S.devs.forEach(d => (d.evid || []).forEach(x => old.push(x.id))); FDB.del(old).catch(() => {}); S = inc; toast('Avance importado'); }
    await importBlobs(o, inc.devs);
    ui = {tab:'list', di:0, step:1, focus:null, q:''}; save(); render(); top0();
  };
  r.readAsText(f); e.target.value = '';
};
document.getElementById('bPrint').onclick = openVista;
document.getElementById('bReset').onclick = async () => {
  if (!(await ask('¿Borrar todo?', `Se borrarán los datos generales, las <b>${S.devs.length}</b> desviación(es) y las conclusiones. No se puede deshacer; si quieres conservarlo, primero usa «Exportar».`, 'Borrar todo', true))) return;
  S = defaults(); FDB.clear().catch(() => {}); ui = {tab:'list', di:0, step:1, focus:null, q:''}; save(); render(); toast('Se borró todo');
};

render();
stat(storeMsg());
if (!WEB) initStore();
})();
